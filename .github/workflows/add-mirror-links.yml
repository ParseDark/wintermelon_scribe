name: Add Mirror Links to Release

on:
  release:
    types: [published]

jobs:
  add-mirror-links:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add Mirror Links
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 获取 Release 信息
          RELEASE_TAG=${{ github.event.release.tag_name }}
          REPO_NAME=${{ github.repository }}
          REPO_SHORT_NAME=$(echo $REPO_NAME | cut -d'/' -f2)

          # 获取 Release 数据
          RELEASE_RESPONSE=$(curl -s \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/${{ github.event.release.id }}")

          # 准备镜像内容
          MIRROR_CONTENT="

          ## 🔥 国内加速下载

          ### 📦 源代码包
          - [${REPO_SHORT_NAME}-${RELEASE_TAG}.zip](https://ghfast.top/https://github.com/${{ github.repository }}/archive/refs/tags/${RELEASE_TAG}/${REPO_SHORT_NAME}-${RELEASE_TAG}.zip)
          - [${REPO_SHORT_NAME}-${RELEASE_TAG}.tar.gz](https://ghfast.top/https://github.com/${{ github.repository }}/archive/refs/tags/${RELEASE_TAG}/${REPO_SHORT_NAME}-${RELEASE_TAG}.tar.gz)"

          # 添加 Release Assets（如果有）
          ASSET_COUNT=$(echo "$RELEASE_RESPONSE" | jq '.assets | length // 0')
          if [ "$ASSET_COUNT" -gt 0 ]; then
            MIRROR_CONTENT="$MIRROR_CONTENT

          ### 📱 编译文件

          "
            # GHFast 镜像
            echo "$RELEASE_RESPONSE" | jq -r '.assets[] | "- [\(.name)](https://ghfast.top/https://github.com/'${REPO_NAME}'/releases/download/'${RELEASE_TAG}'/\(.name))"' >> mirror-links.txt

            MIRROR_CONTENT="$MIRROR_CONTENT$(cat mirror-links.txt)"
            rm -f mirror-links.txt
          fi

          # 更新 Release
          FINAL_BODY="${{ github.event.release.body }}${MIRROR_CONTENT}"

          curl -X PATCH \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            -d "{\"body\":$(echo "$FINAL_BODY" | jq -Rs .)}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/${{ github.event.release.id }}"

          echo "✅ Mirror links added!"

      - name: Update Online Install Script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 获取 Release 信息
          RELEASE_TAG=${{ github.event.release.tag_name }}
          REPO_OWNER=${{ github.repository_owner }}
          REPO_NAME=${{ github.repository }}

          # 更新 online_install.sh 中的版本和下载链接
          if [ -f "online_install.sh" ]; then
            # 更新版本号
            sed -i.bak "s/^LATEST_VERSION=.*/LATEST_VERSION=\"${RELEASE_TAG}\"/" online_install.sh

            # 更新下载链接
            MIRROR_BASE_URL="https://ghfast.top/https://github.com"
            sed -i.bak "s|MAC_ARM_URL=.*|MAC_ARM_URL=\"${MIRROR_BASE_URL}/${REPO_OWNER}/${REPO_NAME#*/}/releases/download/${RELEASE_TAG}/wintermelon_scribe-macos-arm64.tar.gz\"|" online_install.sh
            sed -i.bak "s|MAC_INTEL_URL=.*|MAC_INTEL_URL=\"${MIRROR_BASE_URL}/${REPO_OWNER}/${REPO_NAME#*/}/releases/download/${RELEASE_TAG}/wintermelon_scribe-macos-x86_64.tar.gz\"|" online_install.sh
            sed -i.bak "s|SOURCE_ZIP_URL=.*|SOURCE_ZIP_URL=\"${MIRROR_BASE_URL}/${REPO_OWNER}/${REPO_NAME#*/}/archive/refs/tags/${RELEASE_TAG}/${REPO_NAME#*/}-${RELEASE_TAG}.zip\"|" online_install.sh

            # 删除备份文件
            rm -f online_install.sh.bak

            echo "✅ Updated online_install.sh with version ${RELEASE_TAG}"
          fi

      - name: Commit Changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 检查是否有更改需要提交
          if [ -n "$(git status --porcelain)" ]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"

            # 添加更新的文件
            git add online_install.sh

            # 提交更改
            git commit -m "chore: update online_install.sh to version ${{ github.event.release.tag_name }}

            - Update LATEST_VERSION to ${{ github.event.release.tag_name }}
            - Update download URLs with new release
            - Auto-generated by GitHub Actions"

            # 推送更改
            git push

            echo "✅ Committed and pushed changes"
          else
            echo "ℹ️  No changes to commit"
          fi

      - name: Summary
        run: |
          echo "# ✨ 任务完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ 已添加镜像链接到 Release ${{ github.event.name }}" >> $GITHUB_STEP_SUMMARY
          echo "✅ 已更新 online_install.sh 到版本 ${{ github.event.release.tag_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📋 完成的操作" >> $GITHUB_STEP_SUMMARY
          echo "1. 在 Release 页面添加了 GHFast 加速链接" >> $GITHUB_STEP_SUMMARY
          echo "2. 自动更新了 online_install.sh 中的下载链接" >> $GITHUB_STEP_SUMMARY
          echo "3. 提交了更改到仓库" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "用户现在可以使用在线安装脚本获取最新版本！" >> $GITHUB_STEP_SUMMARY
name: Add Mirror Links to Release

on:
  release:
    types: [published]

jobs:
  add-mirror-links:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Add Mirror Links
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 获取 Release 信息
          RELEASE_TAG=${{ github.event.release.tag_name }}
          REPO_NAME=${{ github.repository }}
          REPO_SHORT_NAME=$(echo $REPO_NAME | cut -d'/' -f2)

          # 获取 Release 数据
          RELEASE_RESPONSE=$(curl -s \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/${{ github.event.release.id }}")

          # 准备镜像内容
          MIRROR_CONTENT="

          ## 🔥 国内加速下载

          ### 📦 源代码包
          - [${REPO_SHORT_NAME}-${RELEASE_TAG}.zip](https://download.fastgit.org/${{ github.repository }}/archive/refs/tags/${RELEASE_TAG}/${REPO_SHORT_NAME}-${RELEASE_TAG}.zip) *(FastGit)*
          - [${REPO_SHORT_NAME}-${RELEASE_TAG}.tar.gz](https://download.fastgit.org/${{ github.repository }}/archive/refs/tags/${RELEASE_TAG}/${REPO_SHORT_NAME}-${RELEASE_TAG}.tar.gz) *(FastGit)*

          - [${REPO_SHORT_NAME}-${RELEASE_TAG}.zip](https://ghproxy.com/${{ github.repository }}/archive/refs/tags/${RELEASE_TAG}/${REPO_SHORT_NAME}-${RELEASE_TAG}.zip) *(备用链接)*
          - [${REPO_SHORT_NAME}-${RELEASE_TAG}.tar.gz](https://ghproxy.com/${{ github.repository }}/archive/refs/tags/${RELEASE_TAG}/${REPO_SHORT_NAME}-${RELEASE_TAG}.tar.gz) *(备用链接)*"

          # 添加 Release Assets（如果有）
          ASSET_COUNT=$(echo "$RELEASE_RESPONSE" | jq '.assets | length // 0')
          if [ "$ASSET_COUNT" -gt 0 ]; then
            MIRROR_CONTENT="$MIRROR_CONTENT

          ### 📱 编译文件

          "
            # FastGit 镜像
            echo "$RELEASE_RESPONSE" | jq -r '.assets[] | "- [\(.name)](https://download.fastgit.org/'${REPO_NAME}'/releases/download/'${RELEASE_TAG}'/\(.name)) *(FastGit)*"' >> mirror-links.txt
            # GHProxy 备用
            echo "$RELEASE_RESPONSE" | jq -r '.assets[] | "- [\(.name)](https://ghproxy.com/'${REPO_NAME}'/releases/download/'${RELEASE_TAG}'/\(.name)) *(备用链接)*"' >> mirror-links.txt

            MIRROR_CONTENT="$MIRROR_CONTENT$(cat mirror-links.txt)"
            rm -f mirror-links.txt
          fi

          # 添加说明
          MIRROR_CONTENT="$MIRROR_CONTENT

          ---
          > 💡 **提示**：以上为免费加速镜像，如无法使用请访问 [GitHub](https://github.com/${{ github.repository }}/releases)"

          # 更新 Release
          FINAL_BODY="${{ github.event.release.body }}${MIRROR_CONTENT}"

          curl -X PATCH \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            -d "{\"body\":$(echo "$FINAL_BODY" | jq -Rs .)}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/${{ github.event.release.id }}"

          echo "✅ Mirror links added!"

      - name: Summary
        run: |
          echo "# ✨ 镜像链接已添加" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 使用了以下免费镜像站：" >> $GITHUB_STEP_SUMMARY
          echo "- **FastGit** - 最快的 GitHub 镜像" >> $GITHUB_STEP_SUMMARY
          echo "- **GHProxy** - 通用反向代理" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "用户现在可以享受国内加速下载！" >> $GITHUB_STEP_SUMMARY
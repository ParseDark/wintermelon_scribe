name: Upload Release Assets to Qiniu

on:
  release:
    types: [published]

jobs:
  upload-to-qiniu:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install @cloudbase-manager/qiniu

      - name: Download all release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ./assets

          # 获取 release 信息
          RELEASE_ID=${{ github.event.release.id }}
          echo "Release ID: $RELEASE_ID"

          # 下载所有 assets
          gh release view $RELEASE_ID --json assets --jq '.assets[] | "\(.name) \(.url)"' | while read -r name url; do
            echo "Downloading $name..."
            curl -L -o "./assets/$name" "$url"
          done

      - name: Upload to Qiniu
        env:
          QINIU_ACCESS_KEY: ${{ secrets.QINIU_ACCESS_KEY }}
          QINIU_SECRET_KEY: ${{ secrets.QINIU_SECRET_KEY }}
          QINIU_BUCKET: ${{ secrets.QINIU_BUCKET }}
          QINIU_DOMAIN: ${{ secrets.QINIU_DOMAIN }}
        run: |
          node -e "
          const crypto = require('crypto');
          const http = require('https');
          const fs = require('fs');
          const path = require('path');

          const accessKey = process.env.QINIU_ACCESS_KEY;
          const secretKey = process.env.QINIU_SECRET_KEY;
          const bucket = process.env.QINIU_BUCKET;
          const domain = process.env.QINIU_DOMAIN;

          // 七牛云上传函数
          function uploadToQiniu(filePath, key) {
            return new Promise((resolve, reject) => {
              // 生成上传 token
              const putPolicy = JSON.stringify({
                scope: bucket + ':' + key,
                deadline: Math.floor(Date.now() / 1000) + 3600
              });

              const encodedPutPolicy = Buffer.from(putPolicy).toString('base64')
                .replace(/\+/g, '-')
                .replace(/\//g, '_');

              const signature = crypto.createHmac('sha1', secretKey)
                .update(encodedPutPolicy)
                .digest('base64');

              const uploadToken = accessKey + ':' + signature + ':' + encodedPutPolicy;

              // 读取文件
              const fileData = fs.readFileSync(filePath);

              // 构建表单数据
              const boundary = '----WebKitFormBoundary' + Math.random().toString(36).substr(2);
              let formData = '--' + boundary + '\\r\\n';
              formData += 'Content-Disposition: form-data; name=\"token\"\\r\\n\\r\\n';
              formData += uploadToken + '\\r\\n';
              formData += '--' + boundary + '\\r\\n';
              formData += 'Content-Disposition: form-data; name=\"key\"\\r\\n\\r\\n';
              formData += key + '\\r\\n';
              formData += '--' + boundary + '\\r\\n';
              formData += 'Content-Disposition: form-data; name=\"file\"; filename=\"' + path.basename(filePath) + '\"\\r\\n';
              formData += 'Content-Type: application/octet-stream\\r\\n\\r\\n';

              const formDataEnd = '\\r\\n--' + boundary + '--\\r\\n';

              const options = {
                hostname: 'upload.qiniup.com',
                port: 443,
                path: '/',
                method: 'POST',
                headers: {
                  'Content-Type': 'multipart/form-data; boundary=' + boundary,
                  'Content-Length': Buffer.byteLength(formData + fileData + formDataEnd)
                }
              };

              const req = http.request(options, (res) => {
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => {
                  if (res.statusCode === 200) {
                    try {
                      const result = JSON.parse(data);
                      console.log('✓ Upload successful:', key);
                      resolve(result);
                    } catch (e) {
                      reject(e);
                    }
                  } else {
                    reject(new Error('Upload failed: ' + data));
                  }
                });
              });

              req.on('error', reject);
              req.write(formData);
              req.write(fileData);
              req.end(formDataEnd);
            });
          }

          // 上传目录中的所有文件
          async function uploadAllFiles() {
            const assetsDir = './assets';
            const files = fs.readdirSync(assetsDir);
            const uploadResults = [];

            for (const file of files) {
              const filePath = path.join(assetsDir, file);
              const stats = fs.statSync(filePath);

              if (stats.isFile()) {
                try {
                  // 使用 release tag 作为目录前缀
                  const key = '${{ github.event.release.tag_name }}/' + file;
                  const result = await uploadToQiniu(filePath, key);
                  const publicUrl = \`https://\${domain}/\${key}\`;
                  uploadResults.push({ file, key, url: publicUrl });
                  console.log('✅', file, '→', publicUrl);
                } catch (error) {
                  console.error('❌ Failed to upload', file, ':', error.message);
                  process.exit(1);
                }
              }
            }

            // 输出所有下载链接
            console.log('\\n📦 所有文件已上传到七牛云：\\n');
            uploadResults.forEach(({ file, url }) => {
              console.log(\`- \${file}: \${url}\`);
            });

            // 生成 Markdown 格式的链接列表
            const markdownLinks = uploadResults
              .map(({ file, url }) => \`- [\${file}](\${url})\`)
              .join('\\n');

            // 将链接写入文件，供后续步骤使用
            fs.writeFileSync('./qiniu-links.md', markdownLinks);
            console.log('\\n📄 Markdown 链接列表已保存到 qiniu-links.md');
          }

          uploadAllFiles().catch(console.error);
          "

      - name: Comment release with Qiniu links
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 读取生成的链接
          if [ -f "./qiniu-links.md" ]; then
            LINKS=$(cat ./qiniu-links.md)

            # 发布评论到 Release
            gh release view ${{ github.event.release.id }} --json body --jq '.body' > release-body.md
            echo "" >> release-body.md
            echo "" >> release-body.md
            echo "## 📦 七牛云下载链接" >> release-body.md
            echo "" >> release-body.md
            echo "$LINKS" >> release-body.md

            # 更新 Release 描述
            gh release edit ${{ github.event.release.id }} --notes-file release-body.md

            echo "✅ 已更新 Release 描述，添加七牛云下载链接"
          fi

      - name: Notify with summary
        run: |
          echo "## 🚀 七牛云上传完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Release: ${{ github.event.release.name }}" >> $GITHUB_STEP_SUMMARY
          echo "Tag: ${{ github.event.release.tag_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "./qiniu-links.md" ]; then
            echo "### 📥 下载链接：" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            cat ./qiniu-links.md >> $GITHUB_STEP_SUMMARY
          fi
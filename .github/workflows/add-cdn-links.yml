name: Add CDN Links to Release

on:
  release:
    types: [published]

jobs:
  add-cdn-links:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate and Add CDN Links
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QINIU_DOMAIN: ${{ secrets.QINIU_DOMAIN }}
        run: |
          # 获取 Release 信息
          RELEASE_TAG=${{ github.event.release.tag_name }}
          REPO_NAME=${{ github.repository }}
          REPO_OWNER=${{ github.repository_owner }}
          REPO_SHORT_NAME=$(echo $REPO_NAME | cut -d'/' -f2)

          echo "🏷️  Release tag: $RELEASE_TAG"
          echo "📂 Repository: $REPO_NAME"
          echo "👤 Owner: $REPO_OWNER"
          echo "📦 Short name: $REPO_SHORT_NAME"

          # 使用 curl 获取 Release 信息
          RELEASE_RESPONSE=$(curl -s \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/${{ github.event.release.id }}")

          # 获取原始内容
          ORIGINAL_BODY=$(echo "$RELEASE_RESPONSE" | jq -r '.body // ""')

          # 检查是否有 assets
          ASSETS_COUNT=$(echo "$RELEASE_RESPONSE" | jq '.assets | length // 0')

          # 构建 CDN 链接内容
          CDN_CONTENT="

          ## 🚀 CDN 加速下载

          > 💡 以下链接通过七牛云 CDN 加速，国内访问速度更快

          ### 📦 源代码
          - [${REPO_SHORT_NAME}-${RELEASE_TAG}.zip](https://${QINIU_DOMAIN}/github-release/${REPO_OWNER}/${REPO_SHORT_NAME}/refs/tags/${RELEASE_TAG}/${REPO_SHORT_NAME}-${RELEASE_TAG}.zip)
          - [${REPO_SHORT_NAME}-${RELEASE_TAG}.tar.gz](https://${QINIU_DOMAIN}/github-release/${REPO_OWNER}/${REPO_SHORT_NAME}/refs/tags/${RELEASE_TAG}/${REPO_SHORT_NAME}-${RELEASE_TAG}.tar.gz)"

          # 如果有 assets，添加 assets 部分
          if [ "$ASSETS_COUNT" -gt 0 ]; then
            CDN_CONTENT="$CDN_CONTENT

          ### 📱 附件下载"

            # 使用临时文件保存 assets 链接
            echo "$RELEASE_RESPONSE" | jq -r '.assets[].name' | while read -r asset_name; do
              echo "          - [$asset_name](https://${QINIU_DOMAIN}/github-release-assets/${REPO_OWNER}/${REPO_SHORT_NAME}/releases/download/${RELEASE_TAG}/${asset_name})"
            done > assets-links.txt

            # 读取 assets 链接到 CDN_CONTENT
            if [ -f assets-links.txt ]; then
              CDN_CONTENT="$CDN_CONTENT
          $(cat assets-links.txt)"
            fi
          fi

          # 添加脚注
          CDN_CONTENT="$CDN_CONTENT

          ---

          *七牛云 CDN 加速由 [${QINIU_DOMAIN}](${QINIU_DOMAIN}) 提供*"

          # 构建最终的 Release 内容
          FINAL_BODY="${ORIGINAL_BODY}${CDN_CONTENT}"

          # 更新 Release
          curl -X PATCH \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Content-Type: application/json" \
            -d "{\"body\":$(echo "$FINAL_BODY" | jq -Rs .)}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/${{ github.event.release.id }}"

          echo "✅ 已在 Release 中添加 CDN 下载链接"

      - name: Show CDN Links Preview
        run: |
          echo "# 🎯 CDN 链接已生成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Release: ${{ github.event.name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 源代码 CDN 链接" >> $GITHUB_STEP_SUMMARY
          echo "- [${{ github.event.repository_name }}-${{ github.event.release.tag_name }}.zip](https://${{ secrets.QINIU_DOMAIN }}/github-release/${{ github.repository_owner }}/${{ github.event.repository_name }}/refs/tags/${{ github.event.release.tag_name }}/${{ github.event.repository_name }}-${{ github.event.release.tag_name }}.zip)" >> $GITHUB_STEP_SUMMARY
          echo "- [${{ github.event.repository_name }}-${{ github.event.release.tag_name }}.tar.gz](https://${{ secrets.QINIU_DOMAIN }}/github-release/${{ github.repository_owner }}/${{ github.event.repository_name }}/refs/tags/${{ github.event.release.tag_name }}/${{ github.event.repository_name }}-${{ github.event.release.tag_name }}.tar.gz)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📋 让 CDN 生效" >> $GITHUB_STEP_SUMMARY
          echo "1. 登录七牛云控制台" >> $GITHUB_STEP_SUMMARY
          echo "2. 进入「对象存储」→ 空间设置 → 镜像存储" >> $GITHUB_STEP_SUMMARY
          echo "3. 配置镜像回源规则（见文档）" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✨ 优势：零存储成本，自动加速！" >> $GITHUB_STEP_SUMMARY